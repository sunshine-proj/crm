services:
  php:
    # build:
    #   context: ./docker/php
    #   dockerfile: Dockerfile
    image: crm/php-1.1
    container_name: php
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
      - ./docker/php/rsyslog.conf:/etc/rsyslog.conf
      - ./docker/php/app-audit.conf:/etc/rsyslog.d/app-audit.conf
    depends_on:
      - postgres
    command: |
      sh -c "
        rsyslogd;
        php-fpm -F;
      "
    networks:
      - app
    # ports:
    #   - "9000:9000"

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    ports:
      - "8081:80"
    volumes:
      - ./src:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - app

  postgres:
    image: postgres:17-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
    volumes:
      - ./storage/postgres/data:/var/lib/postgresql/data
      # - postgres_data:/var/lib/postgresql/data/pgdata
    ports:
      - "5437:5432"
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 5

  logrotate:
    image: crm/php-1.1
    volumes:
      # - ./docker/php/app-audit:/etc/logrotate.d/app-audit:ro
      - ./docker/php/app-audit:/etc/logrotate.d/tmp-app-audit:ro
      - ./storage/logs:/var/log/app
      - ./docker/php/zabbix_agent2.conf:/etc/zabbix/zabbix_agent2.conf:ro
    networks:
      - app
    depends_on:
      - php
    command: >
      sh -c "
        cp /etc/logrotate.d/tmp-app-audit /etc/logrotate.d/app-audit;
        chmod 0600 /etc/logrotate.d/app-audit;
        while true; do
          logrotate /etc/logrotate.d/app-audit;
          sleep 86400;
        done
      "
      # cp /opt/app-audit /etc/logrotate.d/app-audit;
  
  # Generates in-app task/project reminders and escalations hourly (idempotent).
  scheduler:
    image: crm/php-1.1
    container_name: scheduler
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
    depends_on:
      - postgres
    networks:
      - app
    command: >
      sh -c "
        while true; do
          php bin/console app:reminders:run --no-interaction || true;
          sleep 3600;
        done
      "

  # Encrypted off-host daily backups (database + uploaded documents). Not started by default:
  # `docker compose --profile backup up -d backup` after setting BACKUP_AGE_RECIPIENT and BACKUP_REMOTE
  # (plus rclone remote settings). See docs/BACKUP.md.
  backup:
    profiles: ["backup"]
    build:
      context: ./docker/backup
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: app
      PGPASSWORD: secret
      PGDATABASE: app
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      BACKUP_REMOTE: ${BACKUP_REMOTE:-}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-35}
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-02}
      RCLONE_CONFIG: /config/rclone.conf
    volumes:
      - ./src/var/project-documents:/data/project-documents:ro
      - ./storage/backup-status:/var/lib/backup
      - ${BACKUP_RCLONE_CONFIG:-./docker/backup/rclone.conf}:/config/rclone.conf:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app

  rabbitmq:
    image: "rabbitmq:3-management"
    container_name: rabbitmq
    ports:
      - "5674:5672"
      - "15674:15672"
    volumes:
      - ./storage/rabbitmq_data:/var/lib/rabbitmq
    networks:
      - app
    environment:
      - RABBITMQ_DEFAULT_USER
      - RABBITMQ_DEFAULT_PASS

  # -----------------------
  # Zabbix database
  # -----------------------
  zabbix-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: mySuperDFGSecret#$%Password425
      POSTGRES_DB: zabbix
    volumes:
      - zabbix-db-data:/var/lib/postgresql/data
    ports:
      - "5440:5432"
    networks:
      - erp-zabbix
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zabbix -d zabbix"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -----------------------
  # Zabbix server
  # -----------------------
  zabbix-server:
    image: zabbix/zabbix-server-pgsql:alpine-7.4-latest
    restart: unless-stopped
    depends_on:
      zabbix-db:
        condition: service_healthy
    environment:
      DB_SERVER_HOST: zabbix-db
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: mySuperDFGSecret#$%Password425
      POSTGRES_DB: zabbix
    ports:
      - "10053:10051"
    networks:
      - erp-zabbix
      - app
  
  # -----------------------
  # Zabbix web interface
  # -----------------------
  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-7.4-latest
    restart: unless-stopped
    depends_on:
      zabbix-server:
        condition: service_started
      zabbix-db:
        condition: service_healthy
    environment:
      DB_SERVER_HOST: zabbix-db
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: mySuperDFGSecret#$%Password425
      POSTGRES_DB: zabbix
      ZBX_SERVER_HOST: zabbix-server
      PHP_TZ: Europe/Vilnius
    ports:
      - "8120:8080"
    networks:
      - erp-zabbix

networks:
  app:
  erp-zabbix:

volumes:
  static_volume:
  zabbix-db-data:
