services:
  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: php
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
    depends_on:
      - postgres
    networks:
      - app

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./src:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - app

  postgres:
    image: postgres:17-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
    volumes:
      - ./storage/postgres/data/pg:/var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    networks:
      - app

networks:
  app:

volumes:
  static_volume:
