<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Moon Lander</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<meta name="theme-color" content="#05060f">
<style>
html,body{margin:0;height:100%;background:#05060f;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:system-ui,sans-serif}
body{display:flex;align-items:center;justify-content:center}
#c{display:block}
#msg{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;background:rgba(5,6,15,.6);padding:16px;white-space:pre-line;line-height:1.5}
#msg b{font-size:2rem;display:block;margin-bottom:8px}
.pad{position:fixed;bottom:max(16px,env(safe-area-inset-bottom));width:72px;height:72px;border-radius:50%;border:2px solid #8cf;background:rgba(120,180,255,.15);color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center}
.pad.on{background:rgba(120,180,255,.5)}
#l{left:16px}#r{left:100px}#u{right:16px}
@media (hover:hover) and (pointer:fine){.pad{display:none}}
</style></head><body>
<canvas id="c"></canvas>
<div id="msg"></div>
<div class="pad" id="l">◀</div><div class="pad" id="r">▶</div><div class="pad" id="u">▲</div>
<script type="module" src="game.js"></script>
</body></html>
