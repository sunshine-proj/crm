name: validate
description: Lint, format check, type check and tests.
steps:
- name: lint
  command:
  - ruff
  - check
  - .
  timeout_seconds: 600
- name: format
  command:
  - ruff
  - format
  - --check
  - .
  timeout_seconds: 600
- name: typecheck
  command:
  - mypy
  timeout_seconds: 600
- name: test
  command:
  - pytest
  timeout_seconds: 600
