lexik_jwt_authentication:
    secret_key: '%env(resolve:JWT_SECRET_KEY)%'
    public_key: '%env(resolve:JWT_PUBLIC_KEY)%'
    pass_phrase: '%env(JWT_PASSPHRASE)%'
    token_ttl: 3600

when@test:
    # Tests sign tokens with a symmetric key so no key pair has to exist on disk.
    lexik_jwt_authentication:
        secret_key: 'test-only-signing-key-not-a-secret-0123456789abcdef'
        public_key: ~
        pass_phrase: ~
        encoder:
            signature_algorithm: HS256
